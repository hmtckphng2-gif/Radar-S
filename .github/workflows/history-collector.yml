name: Radar history collector

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radar-history-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger protected Render collector
        env:
          COLLECTOR_URL: https://radar-s.onrender.com/internal/collect-history
          COLLECTOR_SECRET: ${{ secrets.HISTORY_COLLECTOR_SECRET }}
        run: |
          if [ -z "$COLLECTOR_SECRET" ]; then
            echo "Missing GitHub Actions secret: HISTORY_COLLECTOR_SECRET"
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 10 --retry-all-errors \
            --max-time 100 \
            -X POST "$COLLECTOR_URL" \
            -H "Authorization: Bearer $COLLECTOR_SECRET" \
            -H "Accept: application/json"
