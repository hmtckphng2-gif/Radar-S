name: Deploy Radar to Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: radar-cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate app and History Cron safety
        run: |
          npm run check
          node tools/mobile-config-check.mjs
          npm test
          node -e "const fs=require('node:fs');const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));if(c.triggers?.crons?.length)process.exit(1)"
      - name: Deploy Worker and assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy worker.js --name radar-s --config wrangler.jsonc
      - name: Verify live Worker and UI assets
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const root = 'https://radar-s.j9fr2vg4vm.workers.dev';
          const expected = JSON.parse(readFileSync('package.json','utf8')).version;
          const request = async path => {
            const response = await fetch(root+path+'?release='+Date.now(),{cache:'no-store'});
            const text = await response.text();
            if(!response.ok)throw Error(path+' HTTP '+response.status);
            return text;
          };
          const response = JSON.parse(await request('/api/version'));
          if(response.version!==expected)throw Error('Expected live '+expected+', got '+response.version);
          if(response.collectorScheduled!==false)throw Error('History collector unexpectedly scheduled');
          for(const [path,marker] of [
            ['/radar43.js','sr80-group-chip'],
            ['/radar83-map.mjs','Radar 8.3'],
            ['/radar83-model.mjs','FLIRT-inspired']
          ]){
            const body=await request(path);
            if(!body.includes(marker))throw Error(path+' missing expected content');
            console.log('Verified',path);
          }
          console.log('Live Radar '+expected+' confirmed');
          NODE
