name: Radar Quality Gate
on:
  push:
    branches: [main, "feature/radar-10-redesign-integration"]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check every JavaScript file and local asset import
        run: npm run check
      - name: Run regression tests
        run: npm test
