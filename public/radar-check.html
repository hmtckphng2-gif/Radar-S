<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Radar Start-Check</title><style>:root{color-scheme:dark}body{margin:0;padding:24px 16px 40px;background:#08101b;color:#edf4ff;font:15px/1.45 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}h1{font-size:24px;margin:12px 0 4px}p{color:#afc1d7}main{max-width:560px;margin:auto}.box{background:#132238;border:1px solid #31445f;border-radius:14px;margin:16px 0;padding:12px}.item{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #243851;padding:8px 1px;word-break:break-word}.item:last-child{border-bottom:0}.result{flex-shrink:0;font-weight:700}.ok{color:#62dbb3}.fail{color:#ff828c}.wait{color:#e8ba77}button{background:#448ffd;border:0;color:white;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:650;margin-right:8px;margin-top:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;color:#c6d7ed;background:#0b1729;border-radius:12px;padding:12px}small{color:#afc1d7}#report{margin-top:12px}</style></head><body><main><h1>🚆 Südtirol Radar – Start-Check</h1><p>Prüft die veröffentlichte Webseite, JavaScript-Dateien, Module und eine Datenquelle. Keine Änderungen an Radar.</p><div id="progress" class="box">Starte Diagnose …</div><div id="list" class="box"></div><button id="again">Erneut testen</button><button id="copy">Bericht kopieren</button><small id="copied"></small><pre id="report" aria-label="Diagnosebericht"></pre><script>
const rows=[['Haupt-App','/app.js'],['Kernlogik','/core.js'],['Radar 4.3','/radar43.js'],['4.3-Modul','/radar43-logic.mjs'],['4.4-Modul','/radar44-logic.mjs'],['4.5-Modul','/radar45-logic.mjs'],['4.5.1-Modul','/radar451-logic.mjs'],['Radar 4.5','/radar45.js'],['GTFS-Proxy','/api/health'],['STA-Feed','/api/sta']];
let report='';
async function req(label,path){let timer,ctl=new AbortController(),stamp=Date.now();try{timer=setTimeout(()=>ctl.abort(),path==='/api/sta'?12000:7000);const r=await fetch(path+'?check='+Date.now(),{cache:'no-store',signal:ctl.signal});const type=r.headers.get('content-type')||'unbekannt';const body=(await r.text()).slice(0,180);if(!r.ok)throw Error('HTTP '+r.status+'; '+type);if(path.endsWith('.js')||path.endsWith('.mjs')){if(/text\/html/i.test(type)||/^\s*<!doctype|^\s*<html/i.test(body))throw Error('HTML statt JavaScript ('+type+')');if(!/javascript|ecmascript|text\/plain/i.test(type))throw Error('Unerwarteter MIME-Typ: '+type);}if(path.startsWith('/api/')){try{const j=JSON.parse(body+''); if(j?.error)throw Error('Feed meldet Fehler: '+j.error)}catch(e){if(e.message.startsWith('Feed meldet'))throw e;}}return {good:true,info:'HTTP '+r.status+' · '+type+' · '+(Date.now()-stamp)+'ms'};}catch(e){return {good:false,info:e.name==='AbortError'?'Zeitüberschreitung':e.message}}finally{clearTimeout(timer)}}
async function run(){document.querySelector('#list').replaceChildren();document.querySelector('#progress').textContent='Prüfe Dateien und Daten …';report='Radar Start-Check '+new Date().toISOString()+'\n'+location.origin+'\n';let bad=0;for(let i=0;i<rows.length;i++){const [label,path]=rows[i],row=document.createElement('div'),left=document.createElement('div'),status=document.createElement('span');row.className='item';left.textContent=label+' ('+path+')';status.className='result wait';status.textContent='…';row.append(left,status);document.querySelector('#list').append(row);const v=await req(label,path);status.className='result '+(v.good?'ok':'fail');status.textContent=v.good?'✓':'✕';status.title=v.info;if(!v.good)bad++;report+=(v.good?'OK    ':'FEHLER ')+path+' — '+v.info+'\n';}const tests=[['Modulimport 4.5','/radar45-logic.mjs'],['Modulimport 4.5.1','/radar451-logic.mjs'],['Modulimport Core','/core.js']];for(const [name,path] of tests){try{await import(path+'?check='+Date.now());report+='OK    '+name+'\n';}catch(e){bad++;report+='FEHLER '+name+' — '+e.message+'\n';}}document.querySelector('#progress').textContent=bad?'⚠ '+bad+' Fehler gefunden – Bericht unten kopieren':'✓ Keine fehlenden Dateien erkannt; Browser-Konsole wäre der nächste Schritt';document.querySelector('#report').textContent=report;}
document.querySelector('#again').onclick=run;document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(report);document.querySelector('#copied').textContent=' Kopiert!'}catch{document.querySelector('#copied').textContent=' Bericht unten manuell markieren'}};run();
</script></main></body></html>
