<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Radar – sichere Karte</title><link rel="stylesheet" href="/vendor/leaflet-1.9.4.css?v=8.3.1"><style>html,body{margin:0;width:100%;height:100%;background:#09111e;color:#edf4ff;font:14px system-ui}#map{position:absolute;inset:0}#bar{position:fixed;z-index:1000;top:env(safe-area-inset-top,0px);left:10px;right:10px;background:#12243bee;border:1px solid #466080;border-radius:14px;padding:11px 13px;display:flex;gap:8px;align-items:center;justify-content:space-between}a{color:#a8c9ff}#state{font-size:12px}.leaflet-container{background:#142237}</style></head><body><div id="map"></div><div id="bar"><strong>RADAR · Sichere Karte</strong><span id="state">Starte …</span><a href="/">App</a></div><script src="/vendor/leaflet-1.9.4.js?v=8.3.1"></script><script type="module">
import {parseVehicles} from '/core.js';
const out=document.getElementById('state');
let map,layer;
try{
 if(!window.L)throw Error('Leaflet fehlt');
 map=L.map('map',{zoomControl:false}).setView([46.64,11.35],9);
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
 layer=L.layerGroup().addTo(map);
 out.textContent='Karte gestartet';
}catch(e){out.textContent='Kartenfehler: '+e.message}
async function refresh(){
 if(!map)return;
 const names=['sta','trentino','trains','sta_direct'];
 const settled=await Promise.allSettled(names.map(async name=>{
  const response=await fetch('/api/'+name,{cache:'no-store'});
  if(!response.ok)throw Error(name+' HTTP '+response.status);
  return response.json();
 }));
 let n=0,ok=0;
 layer.clearLayers();
 for(let i=0;i<settled.length;i++){
  const s=settled[i];if(s.status!=='fulfilled')continue;
  ok++;
  try{
   const parsed=parseVehicles(s.value,names[i],{},Date.now());
   for(const v of parsed.vehicles){
    const lat=Number(v.lat),lon=Number(v.lon??v.lng);
    if(!Number.isFinite(lat)||!Number.isFinite(lon))continue;
    if(v.timestamp&&Date.now()/1000-v.timestamp>1800)continue;
    const train=v.kind==='train';
    const marker=L.circleMarker([lat,lon],{radius:train?6:5,color:'#111d31',weight:2,fillColor:train?'#77b3ff':'#ffc074',fillOpacity:.95});
    marker.bindPopup((train?'Zug':'Bus')+' · '+String(v.name||'Fahrzeug').replace(/[<>&]/g,'') );
    marker.addTo(layer);n++;
   }
  }catch(e){console.warn('Parse '+names[i],e)}
 }
 out.textContent=n+' Fahrzeuge · '+ok+'/4 Feeds';
}
refresh().catch(e=>{out.textContent='Datenfehler: '+e.message});
setInterval(refresh,30000);
</script></body></html>
